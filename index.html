<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OBR | متجر شحن الألعاب</title>
  <style>
    :root {
      --bg-color: #0b0719;
      --card-bg: #160d33;
      --accent-purple: #7b2cbf;
      --accent-blue: #00f3ff;
      --accent-red: #ff0055;
      --text-color: #ffffff;
      --text-dim: #a39bbe;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(45deg, var(--accent-red), var(--accent-purple), var(--accent-blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 20px rgba(123, 44, 191, 0.5);
    }

    .tagline {
      color: var(--accent-blue);
      font-size: 1.1rem;
      margin-top: 5px;
    }

    .container {
      width: 100%;
      max-width: 600px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid rgba(123, 44, 191, 0.3);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    h2 {
      color: var(--accent-blue);
      margin-bottom: 20px;
      border-bottom: 2px solid var(--accent-purple);
      padding-bottom: 10px;
    }

    .games-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 20px;
    }

    .game-option {
      background: #0d0722;
      border: 2px solid transparent;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
      cursor: pointer;
      transition: 0.3s;
    }

    .game-option.active, .game-option:hover {
      border-color: var(--accent-blue);
      box-shadow: 0 0 15px rgba(0, 243, 255, 0.3);
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      color: var(--text-dim);
    }

    input, select {
      width: 100%;
      padding: 12px;
      background: #0d0722;
      border: 1px solid var(--accent-purple);
      border-radius: 8px;
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input:focus, select:focus {
      border-color: var(--accent-blue);
    }

    .payment-info {
      background: rgba(255, 0, 85, 0.1);
      border: 1px dashed var(--accent-red);
      border-radius: 8px;
      padding: 15px;
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .btn-submit {
      width: 100%;
      background: linear-gradient(45deg, var(--accent-purple), var(--accent-red));
      color: white;
      border: none;
      padding: 14px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
    }

    .btn-submit:hover {
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.5);
    }

    .status-msg {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">OBR</div>
    <div class="tagline">متجر شحن الألعاب السريع والموثوق</div>
  </header>

  <div class="container">
    <div class="card">
      <h2>طلب شحن جديد</h2>

      <label>1. اختر اللعبة:</label>
      <div class="games-grid">
        <div class="game-option active" id="opt-ff" onclick="selectGame('Free Fire')">
          🔥 <h3>فري فاير (Free Fire)</h3>
        </div>
        <div class="game-option" id="opt-pubg" onclick="selectGame('PUBG Mobile')">
          🪂 <h3>ببجي (PUBG Mobile)</h3>
        </div>
      </div>

      <form id="orderForm" onsubmit="sendOrderToTelegram(event)">
        <div class="form-group">
          <label for="customerName">اسمك الكامل:</label>
          <input type="text" id="customerName" placeholder="أدخل اسمك" required>
        </div>

        <div class="form-group">
          <label for="playerId">2. معرف اللاعب (Player ID / UID):</label>
          <input type="text" id="playerId" placeholder="مثال: 123456789" required>
        </div>

        <div class="form-group">
          <label for="packageSelect">3. اختر الباقة:</label>
          <select id="packageSelect" required></select>
        </div>

        <div class="payment-info">
          💳 <strong>طريقة الدفع عبر شام كاش (Sham Cash):</strong><br>
          يرجى تحويل المبلغ الموضح إلى المعرف/الرقم: <strong style="color:var(--accent-blue)">SHAM-OBR-102030</strong><br>
          ثم أرفق صورة إشعار التحويل بالأسفل لتأكيد الطلب.
        </div>

        <div class="form-group">
          <label for="receiptImg">4. إرفاق صورة إيصال التحويل:</label>
          <input type="file" id="receiptImg" accept="image/*" required>
        </div>

        <button type="submit" class="btn-submit" id="submitBtn">تأكيد وإرسال الطلب 🚀</button>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </div>

  <script>
    const TELEGRAM_TOKEN = "8937931148:AAFmbpB_nn3iqNhOPgQOGMzt-pCpSW8MD50";
    const CHAT_ID = "8322514038";

    let selectedGame = 'Free Fire';

    const packages = {
      'Free Fire': [
        '100 جوهرة + بونص — 1.00$',
        '210 جواهر + بونص — 2.00$',
        '530 جوهرة + بونص — 5.00$',
        '1080 جوهرة + بونص — 10.00$',
        'العضوية الأسبوعية — 2.20$',
        'العضوية الشهرية — 10.00$'
      ],
      'PUBG Mobile': [
        '60 شدة (UC) — 1.00$',
        '325 شدة (UC) — 5.00$',
        '660 شدة (UC) — 10.00$',
        '1800 شدة (UC) — 25.00$',
        '3850 شدة (UC) — 50.00$'
      ]
    };

    function updatePackages() {
      const select = document.getElementById('packageSelect');
      select.innerHTML = '';
      packages[selectedGame].forEach(pkg => {
        const opt = document.createElement('option');
        opt.value = pkg;
        opt.innerText = pkg;
        select.appendChild(opt);
      });
    }

    function selectGame(game) {
      selectedGame = game;
      document.getElementById('opt-ff').classList.toggle('active', game === 'Free Fire');
      document.getElementById('opt-pubg').classList.toggle('active', game === 'PUBG Mobile');
      updatePackages();
    }

    updatePackages();

    function sendOrderToTelegram(e) {
      e.preventDefault();

      const submitBtn = document.getElementById('submitBtn');
      const statusMsg = document.getElementById('statusMsg');
      const name = document.getElementById('customerName').value;
      const playerId = document.getElementById('playerId').value;
      const pkg = document.getElementById('packageSelect').value;
      const fileInput = document.getElementById('receiptImg');

      if (!fileInput.files || !fileInput.files[0]) {
        alert('يرجى إرفاق صورة إيصال الدفع');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerText = 'جاري إرسال الطلب... ⏳';
      statusMsg.style.color = '#00f3ff';
      statusMsg.innerText = 'جاري المعالجة...';

      const file = fileInput.files[0];
      const formData = new FormData();
      formData.append('chat_id', CHAT_ID);
      formData.append('photo', file);

      const captionText = `🎮 طلب شحن جديد - متجر OBR\n\n` +
                          `👤 الاسم: ${name}\n` +
                          `🕹️ اللعبة: ${selectedGame}\n` +
                          `🆔 الـ ID: ${playerId}\n` +
                          `💎 الباقة: ${pkg}\n` +
                          `⏰ الوقت: ${new Date().toLocaleTimeString('ar-EG')}`;

      formData.append('caption', captionText);

      fetch(`https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendPhoto`, {
        method: 'POST',
        body: formData
      })
      .then(res => res.json())
      .then(data => {
        if (data.ok) {
          statusMsg.style.color = '#00e676';
          statusMsg.innerHTML = '✅ تم إرسال طلبك بنجاح! سيتم الشحن للحساب فوراً.';
          document.getElementById('orderForm').reset();
          updatePackages();
        } else {
          statusMsg.style.color = '#ff0055';
          statusMsg.innerText = '❌ فشل الإرسال: ' + (data.description || 'تأكد من الضغط على Start داخل محادثة البوت.');
        }
      })
      .catch(() => {
        statusMsg.style.color = '#ff0055';
        statusMsg.innerText = '❌ حدث خطأ في الاتصال، حاول مجدداً.';
      })
      .finally(() => {
        submitBtn.disabled = false;
        submitBtn.innerText = 'تأكيد وإرسال الطلب 🚀';
      });
    }
  </script>

</body>
</html>
